name: Feature Request
description: Suggest a new API, module, or improvement for html-tools
title: "[Feature]: "
labels: ["enhancement"]

body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of html-tools does this request relate to?
      options:
        - Query API
        - New module
        - TypeScript types
        - Build or packaging
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem are you trying to solve? What is missing or awkward in the current API?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the API, behavior, or output you would like to see.
      placeholder: |
        ```ts
        import { Query } from "html-tools";

        Query.one("button");
        ```
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workarounds or alternative approaches you have tried.
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Links, references, or examples from other libraries.
    validations:
      required: false
