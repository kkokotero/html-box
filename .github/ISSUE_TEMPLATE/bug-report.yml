name: Bug Report
description: Report incorrect behavior in html-box
title: "[Bug]: "
labels: ["bug"]

body:
  - type: input
    id: version
    attributes:
      label: html-box version
      description: Which version of html-box are you using?
      placeholder: 0.2.1
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened? What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Minimal code that reproduces the issue. Include the relevant selector, scope, and DOM markup.
      render: typescript
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser or runtime, Node version, TypeScript version, bundler, and OS.
      placeholder: |
        Browser: Chrome 140
        Node: 24.x
        TypeScript: 7.0.x
        Bundler: Vite 7
        OS: Ubuntu 24.04
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Logs, stack traces, screenshots, or related issues.
    validations:
      required: false
